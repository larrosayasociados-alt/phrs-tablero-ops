<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario ocupacion · PH Red Suite</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#134e4a">
  <style>
    :root { --dark:#134e4a; --airport:#0f766e; --rosa2:#c2410c; --rosa3:#6d28d9; --empty:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f8fafc; color:#1e293b; }
    header { background:var(--dark); color:#fff; position:sticky; top:0; z-index:10; }
    header .wrap, main { max-width:28rem; margin:0 auto; padding:.85rem 1rem; }
    header p { margin:0; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#99f6e4; }
    header h1 { margin:.15rem 0 0; font-size:1.15rem; }
    .note { font-size:12px; color:#64748b; margin:0 0 12px; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:#475569; margin-bottom:14px; }
    .sw { width:14px; height:14px; border-radius:4px; display:inline-block; vertical-align:-2px; margin-right:4px; }
    .sw-on { background:var(--dark); }
    .sw-off { background:var(--empty); border:1px solid #cbd5e1; }
    .sw-today { box-shadow:inset 0 0 0 2px var(--dark); background:#fff; }
    .house { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:12px; margin-bottom:12px; }
    .house-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .house h2 { margin:0; font-size:1rem; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .badge { font-size:11px; font-weight:800; padding:4px 8px; border-radius:999px; }
    .badge-on { background:#d1fae5; color:#065f46; }
    .badge-off { background:#f1f5f9; color:#64748b; }
    .months { display:grid; gap:14px; margin-top:10px; }
    .month-name { font-size:13px; font-weight:800; margin:0 0 6px; text-transform:capitalize; }
    .weekdays, .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
    .weekdays span { font-size:10px; color:#94a3b8; font-weight:700; }
    .day { aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; background:var(--empty); color:#64748b; }
    .day.out { background:transparent; color:transparent; }
    .day.busy { color:#fff; }
    .day.today { outline:2px solid #0f172a; outline-offset:1px; }
    .airport .day.busy { background:var(--airport); }
    .rosa2 .day.busy { background:var(--rosa2); }
    .rosa3 .day.busy { background:var(--rosa3); }
    .ranges { margin:8px 0 0; padding:0; list-style:none; font-size:12px; color:#475569; }
    .ranges li { margin:2px 0; }
    footer { max-width:28rem; margin:0 auto; padding:8px 16px 28px; font-size:11px; color:#94a3b8; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p>Uso interno · dueños</p>
      <h1>Calendario de ocupación</h1>
    </div>
  </header>
  <main>
    <p class="note">Día de color = alquilado. Día gris = vacío. Sin nombres ni importes.</p>
    <div class="legend">
      <span><i class="sw sw-on"></i>Alquilado</span>
      <span><i class="sw sw-off"></i>Vacío</span>
      <span><i class="sw sw-today"></i>Hoy</span>
    </div>
    <div id="app">Cargando…</div>
  </main>
  <footer id="meta"></footer>
  <script>
    const HOUSES = [
      { id: "Airport Suite", short: "Airport Suite", cls: "airport", color: "#0f766e" },
      { id: "La Rosa Costa 2", short: "La Rosa Costa 2", cls: "rosa2", color: "#c2410c" },
      { id: "La Rosa Costa 3", short: "La Rosa Costa 3", cls: "rosa3", color: "#6d28d9" }
    ];
    const FALLBACK = [
      { apartment: "Airport Suite", arrival: "2026-09-14", departure: "2026-09-21" },
      { apartment: "Airport Suite", arrival: "2026-09-22", departure: "2026-09-25" },
      { apartment: "Airport Suite", arrival: "2026-09-25", departure: "2026-10-02" },
      { apartment: "Airport Suite", arrival: "2026-10-04", departure: "2026-10-21" },
      { apartment: "La Rosa Costa 2", arrival: "2026-09-18", departure: "2026-10-02" },
      { apartment: "La Rosa Costa 2", arrival: "2026-10-06", departure: "2026-10-13" },
      { apartment: "La Rosa Costa 3", arrival: "2026-09-15", departure: "2026-09-30" },
      { apartment: "La Rosa Costa 3", arrival: "2026-10-01", departure: "2026-10-31" }
    ];
    const WEEK = ["L","M","X","J","V","S","D"];
    const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const parse = (s) => new Date(s + "T12:00:00");
    const fmt = (s) => { const d = parse(s); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); };
    const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); };
    let stays = FALLBACK;
    function occupied(house, day) {
      const key = ymd(day);
      return stays.some((s) => s.apartment === house && s.arrival <= key && s.departure > key);
    }
    function ranges(house) {
      const start = today();
      const end = new Date(start.getFullYear(), start.getMonth() + 2, 0);
      const startKey = ymd(start); const endKey = ymd(end);
      return stays.filter((s) => s.apartment === house && s.departure > startKey && s.arrival <= endKey).sort((a,b) => a.arrival.localeCompare(b.arrival));
    }
    function monthGrid(house, year, month) {
      const first = new Date(year, month, 1, 12);
      const lastDate = new Date(year, month + 1, 0).getDate();
      let startPad = first.getDay() - 1; if (startPad < 0) startPad = 6;
      const cells = [];
      for (let i = 0; i < startPad; i++) cells.push('<div class="day out">.</div>');
      const t = ymd(today());
      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d, 12);
        const key = ymd(date);
        const busy = occupied(house, date);
        cells.push('<div class="day' + (busy ? ' busy' : '') + (key === t ? ' today' : '') + '">' + d + '</div>');
      }
      return '<div><p class="month-name">' + MESES[month] + ' ' + year + '</p><div class="weekdays">' + WEEK.map((w) => '<span>' + w + '</span>').join('') + '</div><div class="grid">' + cells.join('') + '</div></div>';
    }
    function render() {
      const now = today();
      const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      document.getElementById('app').innerHTML = HOUSES.map((h) => {
        const on = occupied(h.id, now);
        const list = ranges(h.id);
        const lines = list.length ? list.map((s) => '<li>Alquilado ' + fmt(s.arrival) + ' → ' + fmt(s.departure) + '</li>').join('') : '<li>Sin reservas en estos dos meses</li>';
        return '<section class="house ' + h.cls + '"><div class="house-top"><h2><i class="dot" style="background:' + h.color + '"></i>' + h.short + '</h2><span class="badge ' + (on ? 'badge-on' : 'badge-off') + '">' + (on ? 'Hoy alquilado' : 'Hoy vacío') + '</span></div><div class="months">' + monthGrid(h.id, now.getFullYear(), now.getMonth()) + monthGrid(h.id, next.getFullYear(), next.getMonth()) + '</div><ul class="ranges">' + lines + '</ul></section>';
      }).join('');
    }
    load = async function() {
      try {
        const r = await fetch('./ocupacion.json', { cache: 'no-store' });
        if (r.ok) {
          const data = await r.json();
          if (Array.isArray(data.stays)) stays = data.stays;
          document.getElementById('meta').textContent = 'Datos internos · ' + (data.generated || '');
        }
      } catch (e) {
        document.getElementById('meta').textContent = 'Datos internos';
      }
      render();
    };
    load();
  </script>
</body>
</html>
